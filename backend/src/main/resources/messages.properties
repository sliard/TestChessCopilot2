# Messages de validation centralisés
# Utilisables via {message} dans les annotations @NotBlank, @Size, etc.

# Communs
validation.required=Ce champ est obligatoire
validation.email.invalid=L'email doit être valide
validation.size.min=Doit contenir au moins {min} caractères
validation.size.max=Doit contenir au maximum {max} caractères
validation.size.range=Doit contenir entre {min} et {max} caractères

# Utilisateur
validation.user.email.required=L'email est obligatoire
validation.user.email.format=L'email doit être valide
validation.user.password.required=Le mot de passe est obligatoire
validation.user.password.size=Le mot de passe doit contenir au moins 8 caractères
validation.user.firstname.required=Le prénom est obligatoire
validation.user.lastname.required=Le nom est obligatoire

# Auth
validation.auth.refresh-token.required=Le refresh token est obligatoire

